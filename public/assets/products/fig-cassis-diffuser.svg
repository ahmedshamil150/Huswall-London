<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="fig cassis diffuser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEEEA"/><stop offset="1" stop-color="#DFE1DB"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".03"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <ellipse cx="400" cy="772" rx="250" ry="26" fill="#D3D5CE" opacity=".85" filter="url(#soft)"/>
  
    <g>
      <ellipse cx="400" cy="762" rx="100" ry="13" fill="#4C5A52" opacity=".12"/>
      <path d="M348 690h104v58c0 12-24 18-52 18s-52-6-52-18v-58Z" fill="#8C9A91" opacity=".9"/>
      <rect x="348" y="592" width="104" height="104" rx="6" fill="#B4BEB5" opacity=".75"/>
      <rect x="348" y="592" width="104" height="104" rx="6" fill="url(#glow)" opacity=".4"/>
      <path d="M368 592 330 356M392 592 380 336M416 592 432 342M440 592 474 366" stroke="#4C5A52" stroke-width="5" stroke-linecap="round" opacity=".72"/>
