<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="hand cream trio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1E9E6"/><stop offset="1" stop-color="#E6D8D2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".03"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <ellipse cx="400" cy="772" rx="250" ry="26" fill="#DBC9C2" opacity=".85" filter="url(#soft)"/>
  
    <g>
      <ellipse cx="400" cy="764" rx="150" ry="15" fill="#7A534A" opacity=".1"/>
      <g transform="rotate(-8 400 640)">
        <rect x="286" y="500" width="72" height="248" rx="16" fill="#C9A79C"/>
        <rect x="298" y="462" width="48" height="46" rx="6" fill="#DFC4BB"/>
      </g>
      <g transform="rotate(2 400 640)">
        <rect x="362" y="488" width="76" height="260" rx="16" fill="#DFC4BB"/>
        <rect x="376" y="450" width="48" height="46" rx="6" fill="#C9A79C"/>
      </g>
      <g transform="rotate(10 400 640)">
        <rect x="442" y="506" width="72" height="242" rx="16" fill="#C9A79C"/>
        <rect x="454" y="468" width="48" height="46" rx="6" fill="#DFC4BB"/>
      </g>
      <rect x="372" y="580" width="56" height="92" fill="#F6F1E6" opacity=".85"/>
      <text x="400" y="616" text-anchor="middle" font-family="Georgia, serif" font-size="8" letter-spacing="2" fill="#7A534A">HASSWELL</text>
      <text x="400" y="634" text-anchor="middle" font-family="Georgia, serif" font-size="6" letter-spacing="1.5" fill="#7A534A" opacity=".7">LONDON</text>
    </g>
  <text x="400" y="906" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="6" fill="#7A534A" opacity=".65">HAND CREAM TRIO</text>
  <rect width="800" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>