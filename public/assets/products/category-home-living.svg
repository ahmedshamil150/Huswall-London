<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="home & living">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EFE8"/><stop offset="1" stop-color="#E6E1D5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".03"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <ellipse cx="400" cy="772" rx="250" ry="26" fill="#DAD4C5" opacity=".85" filter="url(#soft)"/>
  
    <g>
      <ellipse cx="400" cy="762" rx="170" ry="16" fill="#8B8371" opacity=".1"/>
      <path d="M258 560c-16 40-18 118 4 158 30 26 108 28 152 6 26-8 46-24 42-58-2-38 2-96-14-118-22-26-110-26-152-8-18 8-26 12-32 20Z" fill="#DDD5C6"/>
      <path d="M276 574c-10 34-12 100 4 132 26 20 90 22 128 4 20-6 36-18 32-46-2-32 2-80-10-98-18-20-92-20-128-6-14 6-20 8-26 14Z" fill="#EDE7DA" opacity=".85"/>
      <path d="M300 600c60 22 120 20 168 0" stroke="#8B8371" stroke-width="1" opacity=".12" fill="none"/>
      <path d="M468 600c14 8 20 18 18 30" stroke="#8B8371" stroke-width="1.5" opacity=".2" fill="none"/>
    </g>
  <text x="400" y="906" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="6" fill="#8B8371" opacity=".65">HOME & LIVING</text>
  <rect width="800" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>