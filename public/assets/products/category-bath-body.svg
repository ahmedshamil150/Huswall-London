<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="bath & body">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EDE6"/><stop offset="1" stop-color="#D9E0D5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".03"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <ellipse cx="400" cy="772" rx="250" ry="26" fill="#CBD3C6" opacity=".85" filter="url(#soft)"/>
  
    <g>
      <ellipse cx="400" cy="764" rx="96" ry="13" fill="#47534A" opacity=".12"/>
      <rect x="334" y="470" width="132" height="290" rx="20" fill="#7C8F7B"/>
      <rect x="334" y="470" width="132" height="290" rx="20" fill="url(#glow)" opacity=".2"/>
      <rect x="380" y="408" width="40" height="70" fill="#47534A" opacity=".8"/>
      <rect x="358" y="392" width="84" height="24" rx="5" fill="#47534A" opacity=".85"/>
      <path d="M442 404h26v-18h-26z" fill="#47534A" opacity=".6"/>
      <rect x="356" y="566" width="88" height="96" fill="#F5EFE4" opacity=".9"/>
      <text x="400" y="608" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#47534A">HASSWELL</text>
      <text x="400" y="630" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="2" fill="#47534A" opacity=".7">LONDON</text>
    </g>
  <text x="400" y="906" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="6" fill="#47534A" opacity=".65">BATH & BODY</text>
  <rect width="800" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>