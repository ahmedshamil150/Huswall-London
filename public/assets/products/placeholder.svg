<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="hasswell london">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1ECE2"/><stop offset="1" stop-color="#E5DCCB"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".03"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <ellipse cx="400" cy="772" rx="250" ry="26" fill="#DACFBC" opacity=".85" filter="url(#soft)"/>
  <g><rect x="290" y="540" width="220" height="216" rx="8" fill="#D9CDB8"/><path d="M290 620h220M360 540v216M440 540v216" stroke="#8E7E66" stroke-width="1" opacity=".3"/></g>
  <text x="400" y="906" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="6" fill="#8E7E66" opacity=".65">HASSWELL LONDON</text>
  <rect width="800" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>