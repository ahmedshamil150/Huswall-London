<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product | Hasswell London</title>
    <meta name="description" content="A considered object for the modern British home, made in small batches." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/store/styles/main.css" />
    <script type="module" src="/store/js/product.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <main id="main">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb" style="padding-top:1.5rem" id="breadcrumb">
          <span><a href="/">Home</a></span>
          <span><a href="/shop">Shop</a></span>
          <span aria-current="page">Product</span>
        </nav>
      </div>

      <div class="container pdp" id="pdp">
        <div class="gallery" id="gallery">
          <div class="gallery__main skeleton"></div>
        </div>

        <div class="pdp__info" id="pdp-info">
          <div class="skeleton" style="height:14px;width:120px;margin-bottom:1rem"></div>
          <div class="skeleton" style="height:38px;width:80%;margin-bottom:1rem"></div>
          <div class="skeleton" style="height:20px;width:100px;margin-bottom:1.5rem"></div>
          <div class="skeleton" style="height:90px"></div>
        </div>
      </div>

      <section class="section section--tight" id="related-section" hidden>
        <div class="container">
          <div class="section-head">
            <div>
              <span class="eyebrow">Continue</span>
              <h2 style="margin-top:.75rem">You may also like</h2>
            </div>
            <a class="link-underline" href="/shop">All products</a>
          </div>
          <div class="product-grid" id="related"></div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
