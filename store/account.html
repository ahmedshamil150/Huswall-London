<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Account | Hasswell London</title>
    <meta name="description" content="View your Hasswell London orders and account details." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/store/styles/main.css" />
    <script type="module" src="/store/js/account.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <main id="main">
      <div class="page-head">
        <div class="container">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <span><a href="/">Home</a></span>
            <span aria-current="page">My Account</span>
          </nav>
          <h1 id="account-greeting">My Account</h1>
          <p class="muted" id="account-email"></p>
        </div>
      </div>

      <div class="container account-layout">
        <nav class="account-nav" aria-label="Account">
          <a href="#orders" data-tab="orders" aria-current="true">Orders</a>
          <a href="#details" data-tab="details">Details</a>
          <button type="button" id="sign-out">Sign out</button>
        </nav>

        <div>
          <div id="account-error" class="notice notice--error" hidden style="margin-bottom:1.5rem"></div>

          <div id="recovery-panel" class="notice notice--warn" hidden style="margin-bottom:1.5rem">
            <p><strong>Set a new password.</strong> Choose a new password below to finish resetting your account.</p>
          </div>

          <section id="panel-orders" aria-labelledby="orders-heading">
            <div class="between" style="margin-bottom:1.5rem">
              <h2 id="orders-heading" style="font-family:var(--font-body);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600">Order history</h2>
              <a class="link-underline" href="/shop" style="font-size:.68rem">Continue shopping</a>
            </div>
            <div id="orders-list">
              <div class="skeleton" style="height:90px;margin-bottom:1rem"></div>
              <div class="skeleton" style="height:90px"></div>
            </div>
          </section>

          <section id="panel-details" hidden aria-labelledby="details-heading">
            <h2 id="details-heading" style="font-family:var(--font-body);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600">Your details</h2>

            <form id="details-form" style="margin-top:1.5rem;max-width:520px">
              <div class="form-grid">
                <div class="field field--full">
                  <label for="full_name">Full name</label>
                  <input class="input" id="full_name" name="full_name" autocomplete="name" />
                </div>
                <div class="field field--full">
                  <label for="phone">Phone</label>
                  <input class="input" id="phone" name="phone" type="tel" autocomplete="tel" />
                </div>
                <div class="field field--full">
                  <label for="email-readonly">Email address</label>
                  <input class="input" id="email-readonly" disabled />
                  <span class="hint">Contact us if you need to change the email on your account.</span>
                </div>
              </div>
              <button class="btn btn--sm" type="submit" style="margin-top:1.5rem">Save details</button>
            </form>

            <div style="margin-top:3rem;padding-top:2.5rem;border-top:1px solid var(--line);max-width:520px">
              <h2 style="font-family:var(--font-body);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600">Password</h2>
              <form id="password-form" style="margin-top:1.25rem">
                <div class="field">
                  <label for="new-password">New password</label>
                  <input class="input" id="new-password" type="password" autocomplete="new-password" minlength="8" required />
                  <span class="hint">At least 8 characters.</span>
                </div>
                <button class="btn btn--outline btn--sm" type="submit" style="margin-top:1rem">Update password</button>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
